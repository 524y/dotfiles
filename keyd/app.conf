[*]
capslock_l.space = toggle(mark_l)
capslock_l.h = backspace
capslock_l.d = delete
capslock_l.a = home
capslock_l.e = end
capslock_l.p = up
capslock_l.n = down
capslock_l.f = right
capslock_l.b = left
capslock_l.v = pagedown
capslock_l.m = enter
capslock_l.w = C-x
capslock_l.y = C-v
capslock_l.k = macro(S-end C-x)
capslock_l.s = C-f
capslock_l.g = escape
capslock_l./ = C-z
capslock_l.x = oneshot(ctrlx_l)

escape = oneshot(esc_l)
esc_l.escape = escape

alt_l.f = C-right
alt_l.b = C-left
alt_l.v = pageup
alt_l.w = C-c
alt_l.d = macro(C-S-right C-x)

shift+alt_l.comma = C-home
shift+alt_l.dot = C-end

capslock_l+mark_l.a = S-home
capslock_l+mark_l.e = S-end
capslock_l+mark_l.p = S-up
capslock_l+mark_l.n = S-down
capslock_l+mark_l.f = S-right
capslock_l+mark_l.b = S-left
capslock_l+mark_l.w = togglem(mark_l, C-x)
capslock_l+mark_l.g = togglem(mark_l, escape)

alt_l+mark_l.f = C-S-right
alt_l+mark_l.b = C-S-left
alt_l+mark_l.w = togglem(mark_l, C-c)

ctrlx_l.h = C-a
ctrlx_l.k = C-w

capslock_l+ctrlx_l.f = C-o
capslock_l+ctrlx_l.s = C-s
capslock_l+ctrlx_l.w = S-C-s
capslock_l+ctrlx_l.c = A-f4

[google-chrome]
capslock_l.s = C-g
capslock_l.r = S-C-g
shift+capslock_l.m = C-enter
alt_l+capslock_l.p = C-pagedown
alt_l+capslock_l.n = C-pageup

