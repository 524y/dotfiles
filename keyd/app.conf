[*]
capslock_l.space = toggle(mark_l)
capslock_l.h = backspace
capslock_l.d = delete
capslock_l.a = home
capslock_l.e = end
capslock_l.p = up
capslock_l.n = down
capslock_l.f = right
capslock_l.b = left
capslock_l.v = pagedown
capslock_l.m = enter
capslock_l.w = C-x
capslock_l.y = C-v
capslock_l.k = macro(S-end C-x)
capslock_l.s = C-f
capslock_l.g = escape
capslock_l./ = C-z
capslock_l.x = oneshot(ctrlx_l)

escape = oneshot(esc_l)
esc_l.escape = escape

alt_l.f = C-right
alt_l.b = C-left
alt_l.v = pageup
alt_l.w = C-c
alt_l.d = macro(C-S-right C-x)

shift+alt_l.comma = C-home
shift+alt_l.dot = C-end

mark_l+capslock_l.a = S-home
mark_l+capslock_l.e = S-end
mark_l+capslock_l.p = S-up
mark_l+capslock_l.n = S-down
mark_l+capslock_l.f = S-right
mark_l+capslock_l.b = S-left
mark_l+capslock_l.w = togglem(mark_l, C-x)
mark_l+capslock_l.y = togglem(mark_l, C-v)
mark_l+capslock_l.k = togglem(mark_l, S-end C-x)
mark_l+capslock_l.g = togglem(mark_l, escape)

mark_l+alt_l.f = C-S-right
mark_l+alt_l.b = C-S-left
mark_l+alt_l.w = togglem(mark_l, C-c)
mark_l+alt_l.d = togglem(mark_l, C-S-right C-x)

ctrlx_l.h = C-a
ctrlx_l.k = C-w

ctrlx_l+capslock_l.f = C-o
ctrlx_l+capslock_l.s = C-s
ctrlx_l+capslock_l.w = C-S-s
ctrlx_l+capslock_l.c = A-f4

